solution:
  created-for: CMSIS-Toolbox@2.15.0
  cdefault:
  compiler: AC6

  packs:
    - pack: PyTorch::ExecuTorch@1.5.1
    - pack: AlifSemiconductor::Ensemble@2.2.1
    - pack: ARM::CMSIS@^6.2.0
    - pack: ARM::CMSIS-Compiler@^2.1.0
    - pack: ARM::CMSIS-RTX@^5.9.0
    - pack: ARM::SDS@3.1.0
    - pack: ARM::V2M_MPS3_SSE_300_BSP@1.5.0
    - pack: Keil::MDK-Middleware@^8.0.0

  target-types:
    - type: SSE-300-U55-256
      board: V2M-MPS3-SSE-300-FVP
      device: SSE-300-MPS3
      variables:
        - Board-Layer: $SolutionDir()$/board/Corstone-300/Board-U55-256.clayer.yml
        - SDSIO-Layer: $SolutionDir()$/sdsio/fvp/sdsio_fvp.clayer.yml
        - AI-Layer: $SolutionDir()$/ai_layer_pose/ai_layer.clayer.yml
      target-set:
        - set:
          images:
            - project-context: pose-estimation.Debug
          debugger:
            name: Arm-FVP
            model: FVP_Corstone_SSE-300_Ethos-U55
            config-file: board/Corstone-300/fvp_config_u55_256.txt
            args: "--simlimit 300"

    - type: DevKit-E7-HP
      board: DevKit-E7
      device: AE722F80F55D5LS:M55_HP
      variables:
        - Board-Layer: $SolutionDir()$/board/DevKit-E7/M55_HP/Board_HP.clayer.yml
          copied-from: ${CMSIS_PACK_ROOT}/AlifSemiconductor/Ensemble/2.2.1/Boards/DevKit-e7/Layers/M55_HP/
        - SDSIO-Layer: $SolutionDir()$/sdsio/usb/sdsio_usb.clayer.yml
          copied-from: ${CMSIS_PACK_ROOT}/ARM/SDS/3.1.0/layer/sdsio/usb/
        - AI-Layer: $SolutionDir()$/ai_layer_pose/ai_layer.clayer.yml
      target-set:
        - set:
          images:
            - project-context: pose-estimation.Debug
          debugger:
            name: ULINKplus@pyOCD

  build-types:
    - type: Debug
      debug: on
      optimize: debug

  projects:
    - project: ./pose-estimation.cproject.yml

  mlops:
    description: Google MoveNet Lightning 17-keypoint estimator for Ethos-U55-256
    npu:
      type: Ethos-U55
      macs: 256
    vela:
      system: RTSS_HP_SRAM_MRAM
      memory: Shared_Sram
    model:
      clayer: $AI-Layer$
      name: GoogleMoveNetLightning
      module: pose_model
      input-shape: 1x192x192x3
      calibration-samples: 8
